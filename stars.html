<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04030b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>我们的星空 · 建设中</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2228%22 fill=%22%2305030a%22 stroke=%22%23ff3fa4%22 stroke-width=%224%22/%3E%3Cpath d=%22M22 30q10 10 20 0%22 stroke=%22%233ee8ff%22 stroke-width=%224%22 fill=%22none%22/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#04030b;overflow:hidden;color:#ffeef8;font-family:"PingFang SC","Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.t{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 38%);text-align:center;pointer-events:none;animation:in 2.4s ease-out both}
.t h1{font-weight:500;font-size:24px;letter-spacing:.4em;margin-right:-.4em;text-shadow:0 0 18px rgba(255,63,164,.65),0 0 40px rgba(62,232,255,.3)}
.t p{margin-top:14px;font:500 9px/1 "SF Mono",Menlo,monospace;letter-spacing:.5em;margin-right:-.5em;color:rgba(62,232,255,.75)}
.back{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);padding:8px 18px;border:1px solid rgba(255,255,255,.25);border-radius:20px;
  color:rgba(255,240,248,.75);text-decoration:none;font:500 11px/1 "SF Mono",Menlo,monospace;letter-spacing:.2em;-webkit-tap-highlight-color:transparent}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="t"><h1>我们的星空 · 建设中</h1><p>OUR SKY · UNDER CONSTRUCTION</p></div>
<a class="back" href="./">← 回到门口</a>
<script>
(() => {
  const cv = document.getElementById('c'), x = cv.getContext('2d');
  let W, H, S = [], shoot = null;
  function size() {
    const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    S = Array.from({ length: Math.round(W * H / 2600) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + .2, p: Math.random() * 6.28, s: .6 + Math.random() * 1.8,
      c: Math.random() < .12 ? '255,140,210' : (Math.random() < .12 ? '140,235,255' : '255,248,252') }));
  }
  function f(now) {
    const t = now / 1000;
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#04030b'); g.addColorStop(.6, '#0d0820'); g.addColorStop(1, '#2a0f33');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    for (const s of S) { x.fillStyle = `rgba(${s.c},${.25 + .75 * Math.abs(Math.sin(t * s.s + s.p))})`; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.28); x.fill(); }
    if (!shoot && Math.random() < .006) shoot = { x: Math.random() * W * .8 + W * .2, y: Math.random() * H * .4, v: 7 + Math.random() * 5, l: 0 };
    if (shoot) {
      shoot.l += 1; const k = shoot.l;
      const gx = x.createLinearGradient(shoot.x, shoot.y, shoot.x + 60, shoot.y - 30);
      gx.addColorStop(0, 'rgba(255,255,255,.95)'); gx.addColorStop(1, 'rgba(255,63,164,0)');
      x.strokeStyle = gx; x.lineWidth = 1.4; x.beginPath(); x.moveTo(shoot.x, shoot.y); x.lineTo(shoot.x + 60, shoot.y - 30); x.stroke();
      shoot.x -= shoot.v; shoot.y += shoot.v / 2; if (k > 60) shoot = null;
    }
    requestAnimationFrame(f);
  }
  addEventListener('resize', size); size(); requestAnimationFrame(f);
})();
</script>
</body>
</html>
